# The benchmark config. Every arm is selected from this file; no code changes
# between runs. Anything that could differ between arms and is not an arm's
# stated difference is pinned here.

corpus: multihop-rag-v1
golden_set: golden/v1.jsonl

# Identical for every arm, so no arm can win by using a better model.
generator:
  model: claude-opus-5
  effort: high
  max_tokens: 4096

judges:
  # Primary judge is an NLI entailment model: deterministic, and not subject to
  # the position / verbosity / self-preference biases an LLM judge carries.
  entailment: deberta-v3-large-mnli
  # Second opinion only, and deliberately a DIFFERENT model from the generator:
  # a model judging its own output shows self-preference bias, which lands
  # straight on faithfulness, relevance and judge_disagreement.
  second_opinion: claude-sonnet-5

defaults:
  index: chunks-v1
  k: 10

# Held constant across every arm.
# sentence_overlap is 0, NOT Elastic's default of 1: overlap puts every sentence
# in two chunks with two different ids, which makes gold_chunks ambiguous (a
# retriever returning the other chunk containing the answer scores as a miss)
# and duplicates entities into the graph, inflating the node degree that A6's
# routing signal is built on.
chunking:
  strategy: sentence
  max_words: 250
  sentence_overlap: 0
  max_chars: 2000

run:
  reps: 2
  seed: 20260905
  interleave: true
  max_case_seconds: 180

arms:
  # A0 - controls for questions answerable from parametric memory. Every other
  # arm's result is reported as lift over this one, not over zero.
  - id: A0
    kind: closed_book

  - id: A1
    kind: retrieval
    retriever:
      type: bm25

  - id: A2
    kind: retrieval
    retriever:
      type: dense

  - id: A3
    kind: retrieval
    retriever:
      type: rrf
      sources: [bm25, dense, elser]
      rank_constant: 60
      rank_window_size: 100

  # A3b - is RRF the weak default the literature says it is?
  # Weights are UNIFORM and untuned. Bruch et al.'s result that convex
  # combination beats RRF depends on weights tuned on held-out data; guessing
  # three numbers and calling the comparison fair would measure the guess. If
  # this arm is to be tuned, tune it on a held-out slice and publish the split.
  - id: A3b
    kind: retrieval
    retriever:
      type: linear
      sources: [bm25, dense, elser]
      normalizer: minmax
      weights: {bm25: 0.333, dense: 0.333, elser: 0.333}
      rank_window_size: 100

  - id: A4
    kind: retrieval
    retriever:
      type: rrf
      sources: [bm25, dense, elser]
      rank_constant: 60
      rank_window_size: 100
    rerank:
      inference_id: .rerank-v1-elasticsearch
      field: text
      depth: 100

  # A5 is A4 plus graph expansion, expressed as a delta rather than a copied
  # block. Duplicating A4's retriever by hand lets the two drift, and then a
  # window-size difference gets reported as a knowledge-graph effect.
  - id: A5
    kind: retrieval
    extends: A4
    graph_expansion: true

  # A6 - the contribution: route on entity presence and local connectivity.
  - id: A6
    kind: router
    signal: corpus
    routes: [A1, A4, A5]
    retry:
      max: 1
      widen_k: 50

  # A7 - the baseline A6 must beat. Same routes, phrasing signal only.
  - id: A7
    kind: router
    signal: query
    routes: [A1, A4, A5]
    retry:
      max: 1
      widen_k: 50

  # A8 - indexing vs routing. Same retrieval as A4, but against an index built
  # with contextual retrieval (an LLM prepends 50-100 tokens of document
  # context to each chunk before embedding). Orthogonal to the fusion axis:
  # it changes what is indexed, not how results are merged. Requires a second
  # index, so `defaults.index` is overridden per run rather than per arm.
  - id: A8
    kind: retrieval
    extends: A4

  # A9 - the ceiling. Claude chooses retrievers via tool use, unbounded. NOT
  # the design: an LLM in the routing path adds 300-800ms to every query, and
  # because it reads the query text its decision cannot be attributed to the
  # corpus signal rather than to phrasing - which would collapse A6 vs A7.
  # It is here as the "what does unlimited budget buy" upper bound that A6
  # tries to approach cheaply.
  - id: A9
    kind: router
    signal: query
    routes: [A1, A4, A5]
    retry:
      max: 1
      widen_k: 50
