name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor we declare; 3.14 is what the author develops on.
        # Testing both catches a version-specific assumption before it ships.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

      # The config and golden set are the experiment. If either stops
      # validating, the numbers a run produces are not the numbers the config
      # claims to describe - so this is a build failure, not a warning.
      - name: Validate config and golden set
        run: ar validate
